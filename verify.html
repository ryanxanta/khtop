<!DOCTYPE html>
<html>
<head>
  <title>Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', Arial, sans-serif;
      background: #ffffff;
    }

    .header {
      background: #d60000;
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
    }

    .container {
      padding: 18px;
      text-align: center;
    }

    .status {
      color: #d60000;
      font-size: 34px;
      font-weight: 700;
      margin: 15px 0;
    }

    .desc {
      font-size: 14px;
      color: #1f3a5f;
      margin-bottom: 15px;
    }

    .pin {
      font-size: 20px;
      letter-spacing: 3px;
      color: #d60000;
      margin: 10px 0;
    }

    .info-text {
      font-size: 13px;
      margin: 5px 0;
    }

    .section {
      margin-top: 20px;
      text-align: left;
    }

    .section-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #f2f2f2;
      margin-bottom: 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<div class="header">Result</div>
<div class="container">
  <div id="app">Loading...</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3QJr8LHmEbk_7-dswwM38QY9SiMT3z7Ngk1M7NHp4EIaSUiSZNAMQXxywiUXvQIVMzQ/exec";

const params = new URLSearchParams(window.location.search);
const pin = params.get("pin");

const app = document.getElementById("app");

// 👉 没有 PIN
if (!pin) {
  app.innerHTML = `<div class="status">No PIN Provided</div>`;
} else {

  fetch(API_URL + "?pin=" + encodeURIComponent(pin))
    .then(res => res.json())
    .then(record => {

      console.log("API:", record);

      // 👉 查不到
      if (!record) {
        app.innerHTML = `<div class="status">Invalid / Fake Product</div>`;
        return;
      }

      const formattedPin = pin.match(/.{1,4}/g)?.join(" ") || pin;

      app.innerHTML = `
        <div class="status">Successful</div>

        <div class="desc">
          Thank you for purchasing<br>
          Genuine Product
        </div>

        <div class="pin">${formattedPin}</div>

        <div class="info-text">Checked: ${record.check_count || 1} times</div>
        <div class="info-text">First Check: ${record.first_check || "-"}</div>

        <div class="section">
          <div class="section-title">PRODUCT INFO</div>

          <div class="row"><span>Part No</span><span>${record.part_number || "-"}</span></div>
          <div class="row"><span>Name</span><span>${record.part_name || "-"}</span></div>
          <div class="row"><span>Distributor</span><span>${record.distributor || "-"}</span></div>
          <div class="row"><span>Origin</span><span>${record.origin || "-"}</span></div>
          <div class="row"><span>Batch</span><span>${record.batch || "-"}</span></div>
          <div class="row"><span>MFG Date</span><span>${record.mfg_date || "-"}</span></div>
        </div>
      `;
    })
    .catch(err => {
      console.error(err);
      app.innerHTML = `<div class="status">System Error</div>`;
    });
}
</script>

</body>
</html>
