<!DOCTYPE html>
<html>
<head>
  <title>Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Better font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">
  <div class="main">
    <div class="container">
      <div id="app">
        <div class="loading">
          <div class="spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">&copy; Hong Leong Yamaha Motor Sdn. Bhd.</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3QJr8LHmEbk_7-dswwM38QY9SiMT3z7Ngk1M7NHp4EIaSUiSZNAMQXxywiUXvQIVMzQ/exec";

const params = new URLSearchParams(window.location.search);
const pin = params.get("pin");

const app = document.getElementById("app");

const ICON_CHECK_CIRCLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';
const ICON_X_CIRCLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.25"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>';
const ICON_BOX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>';
const ICON_HASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>';
const ICON_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';
const ICON_LAYERS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>';
const ICON_CALENDAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>';

function renderMessage(status, desc) {
  app.innerHTML = `
    <div class="verify-hero">
      <div class="verify-icon is-error">${ICON_X_CIRCLE}</div>
      <div class="verify-status-text is-error">${status}</div>
      <div class="verify-desc">${desc}</div>
    </div>
  `;
}

if (params.has("pin") && !pin) {
  window.location.replace("scan.html");
} else if (!pin) {
  renderMessage("NO PIN PROVIDED", "Please scan a valid QR code or enter a PIN to verify this product.");
} else {

  app.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Checking product...</div>
    </div>
  `;

  fetch(API_URL + "?pin=" + encodeURIComponent(pin))
    .then(res => res.json())
    .then(record => {

      console.log(record);

      if (!record) {
        renderMessage("INVALID PIN", "This PIN could not be verified. This product may not be genuine.");
        return;
      }

      const mfgDate = record.mfg_date
        ? new Date(record.mfg_date).toLocaleString('en-US').replace(',', '')
        : "-";

      document.getElementById("app").innerHTML = `
        <div class="verify-hero">
          <div class="verify-icon">${ICON_CHECK_CIRCLE}</div>
          <div class="verify-status-text">VERIFIED GENUINE</div>
          <div class="verify-desc">This product has been verified as an authentic Yamaha part.</div>
        </div>

        <div class="detail-section">
          <div class="detail-label">${ICON_SHIELD}<span>Authentication</span></div>
          <div class="detail-card">
            <div class="detail-row">
              <div class="detail-row-label">${ICON_HASH}<span>Scraping Number</span></div>
              <div class="detail-row-value">${pin}</div>
            </div>
            <div class="detail-row">
              <div class="detail-row-label">${ICON_SEARCH}<span>Query Times</span></div>
              <div class="detail-row-value">${record.check_count || 1}</div>
            </div>
          </div>
        </div>

        <div class="detail-section">
          <div class="detail-label">${ICON_BOX}<span>Product Details</span></div>
          <div class="detail-card">
            <div class="detail-row">
              <div class="detail-row-label">${ICON_BOX}<span>Part Name</span></div>
              <div class="detail-row-value">${record.part_name || "-"}</div>
            </div>
            <div class="detail-row">
              <div class="detail-row-label">${ICON_HASH}<span>Part Number</span></div>
              <div class="detail-row-value">${record.part_number || "-"}</div>
            </div>
            <div class="detail-row">
              <div class="detail-row-label">${ICON_LAYERS}<span>Batch Number</span></div>
              <div class="detail-row-value">${record.batch || "-"}</div>
            </div>
            <div class="detail-row">
              <div class="detail-row-label">${ICON_CALENDAR}<span>Mfg Date</span></div>
              <div class="detail-row-value">${mfgDate}</div>
            </div>
            <div class="detail-row">
              <div class="detail-row-label">${ICON_BOX}<span>Packing Size</span></div>
              <div class="detail-row-value">${record.packing_size || "-"}</div>
            </div>
          </div>
        </div>
      `;
    })
    .catch(err => {
      console.error(err);
      renderMessage("SYSTEM ERROR", "Something went wrong while verifying this product. Please try again.");
    });
}
</script>

</body>
</html>
