<!DOCTYPE html>
<html>
<head>
  <title>Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Better font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">
  <div class="header">Verification Result</div>

  <div class="main">
    <div class="container">
      <div class="card">
        <div id="app">
          <div class="loading">
            <div class="spinner"></div>
            <div class="loading-text">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">&copy; Hong Leong Yamaha Motor Sdn. Bhd.</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx3QJr8LHmEbk_7-dswwM38QY9SiMT3z7Ngk1M7NHp4EIaSUiSZNAMQXxywiUXvQIVMzQ/exec";

const params = new URLSearchParams(window.location.search);
const pin = params.get("pin");

const app = document.getElementById("app");

// ✅ 没有 PIN
if (!pin) {
  app.innerHTML = `<div class="status">No PIN</div>`;
} else {

  // 🔥 每次查询前显示 loading
  app.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Checking product...</div>
    </div>
  `;


  fetch(API_URL + "?pin=" + encodeURIComponent(pin))
    .then(res => res.json())
    .then(record => {

      console.log(record);

      // ✅ 查不到
      if (!record) {
        app.innerHTML = `<div class="status">Invalid</div>`;
        return;
      }

      // ✅ 防止 pin format error
      const formattedPin = pin.match(/.{1,4}/g)?.join(" ") || pin;

      // 🔥🔥🔥 你原本的 UI（完全保留）
      document.getElementById("app").innerHTML = `
        <div class="result-logo">
            <img src="logo.png" alt="Genuine Logo">
        </div>

        <div class="status">Successful</div>

        <div class="desc">
          Thank you for purchasing Yamaha<br>
          Genuine Product.
        </div>

        <div class="pin-title">Your Authentication PIN</div>
        <div class="pin">${formattedPin}</div>

        <div class="info-text">Being checked: ${record.check_count || 1} times</div>

        <div class="info-text">1st checking date & time:</div>
        <div class="info-text">${record.first_check || "-"}</div>

        <div class="section">
          <div class="section-title">PRODUCT INFORMATION</div>

          <div class="table">
            <div class="row">
              <div class="label">Part Number</div>
              <div class="value">${record.part_number || "-"}</div>
            </div>

            <div class="row">
              <div class="label">Part Name</div>
              <div class="value">${record.part_name || "-"}</div>
            </div>

            <div class="row">
              <div class="label">Distributor</div>
              <div class="value">${record.distributor || "-"}</div>
            </div>

            <div class="row">
              <div class="label">Part Origin</div>
              <div class="value">${record.origin || "-"}</div>
            </div>

            <div class="row">
              <div class="label">Batch Number</div>
              <div class="value">${record.batch || "-"}</div>
            </div>

            <div class="row">
              <div class="label">Manufacturing Date</div>
              <div class="value">
                ${record.mfg_date ? new Date(record.mfg_date).toLocaleString('en-MY') : "-"}
              </div>
            </div>
          </div>
        </div>
      `;
    })
    .catch(err => {
      console.error(err);
      app.innerHTML = `<div class="status">System Error</div>`;
    });
}
</script>

</body>
</html>
