<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="header">Product Verification</div>

  <div class="main">
    <div class="container">
      <div class="card">
        <img class="brand-logo" src="logo.png" alt="Genuine Logo">

        <div class="title">Verify Your Product</div>
        <div class="subtitle">Enter the authentication PIN found on your product label</div>

        <div class="field">
          <label for="pin">Authentication PIN</label>
          <input id="pin" class="input" placeholder="Enter PIN" inputmode="numeric" autocomplete="off">
        </div>

        <button class="btn btn-primary" onclick="go()">Verify</button>

        <div class="divider"><span>OR</span></div>

        <a href="scan.html" class="btn btn-outline">Scan QR Code</a>
      </div>
    </div>
  </div>

  <div class="footer">&copy; Hong Leong Yamaha Motor Sdn. Bhd.</div>
</div>

<script>
function go() {
  const pin = document.getElementById("pin").value.trim();
  if (!pin) return;
  window.location.href = "verify.html?pin=" + encodeURIComponent(pin);
}

document.getElementById("pin").addEventListener("keydown", function (e) {
  if (e.key === "Enter") go();
});
</script>

</body>
</html>
