<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan QR Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">
  <div class="header">Scan QR Code</div>

  <div class="main">
    <div class="container">
      <div class="card">
        <div class="title">Scan Product Code</div>
        <div class="subtitle">Point your camera at the QR code on the product label</div>

        <div class="scanner-wrap">
          <div id="reader"></div>
        </div>

        <div id="error" class="error-box"></div>

        <a href="index.html" class="btn btn-outline" style="margin-top: 20px;">Enter PIN Manually</a>
      </div>
    </div>
  </div>

  <div class="footer">&copy; Hong Leong Yamaha Motor Sdn. Bhd.</div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const errorEl = document.getElementById("error");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
  }

  function extractPin(decodedText) {
    try {
      const url = new URL(decodedText);
      const pinFromUrl = url.searchParams.get("pin");
      if (pinFromUrl) return pinFromUrl;
    } catch (e) {
      // Not a URL, fall through to treat the raw text as the PIN.
    }
    return decodedText.trim();
  }

  function onScanSuccess(decodedText) {
    const pin = extractPin(decodedText);
    if (!pin) {
      showError("Could not read a valid PIN from this code.");
      return;
    }
    window.location.href = "https://yamaiube.com/verify.html?pin=" + encodeURIComponent(pin);
  }

  const html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess,
    () => {} // ignore per-frame scan failures
  ).catch(err => {
    showError("Camera access failed. Please allow camera permission or enter your PIN manually.");
    console.error(err);
  });
</script>

</body>
</html>
